<header class="header" [class.scrolled]="scrolled">
  <div class="container header-content">

    <a class="logo-box" [routerLink]="['/']" (click)="closeMenu()" appTrackClick="Logo">
      <img src="assets/logos/VAMS_new_logo.png" loading="lazy" alt="VAMS Mechatronica" />
    </a>

    <!-- Desktop Navigation -->
    <nav class="nav">
      <a [routerLink]="['/']" fragment="services" appTrackClick>Solutions</a>
      <a [routerLink]="['/promonitor']" routerLinkActive="active" appTrackClick>ProMonitor</a>
      <a [routerLink]="['/job-shop-scheduling']" routerLinkActive="active" appTrackClick>Scheduling</a>
      <a [routerLink]="['/industries']" routerLinkActive="active" appTrackClick>Industries</a>
      <a [routerLink]="['/case-studies']" routerLinkActive="active" appTrackClick>Case Studies</a>
      <a [routerLink]="['/about']" routerLinkActive="active" appTrackClick>About</a>
      <a [routerLink]="['/contact']" class="contact-btn" appTrackClick>Contact Us</a>
    </nav>

    <!-- Mobile Toggle -->
    <button
      class="mobile-toggle"
      [class.is-open]="isMenuOpen"
      aria-label="Toggle menu"
      [attr.aria-expanded]="isMenuOpen"
      (click)="toggleMenu()"
      appTrackClick="Mobile menu toggle"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Navigation -->
  <div
    class="mobile-nav-backdrop"
    *ngIf="isMenuOpen"
    role="button"
    tabindex="0"
    aria-label="Close menu"
    (click)="closeMenu()"
    (keydown.enter)="closeMenu()"
    (keydown.space)="closeMenu()"
  ></div>
  <nav class="mobile-nav" [class.open]="isMenuOpen">
    <a [routerLink]="['/']" fragment="services" (click)="closeMenu()" appTrackClick>Solutions</a>
    <a [routerLink]="['/promonitor']" routerLinkActive="active" (click)="closeMenu()" appTrackClick>ProMonitor</a>
    <a [routerLink]="['/job-shop-scheduling']" routerLinkActive="active" (click)="closeMenu()" appTrackClick>Scheduling</a>
    <a [routerLink]="['/industries']" routerLinkActive="active" (click)="closeMenu()" appTrackClick>Industries</a>
    <a [routerLink]="['/case-studies']" routerLinkActive="active" (click)="closeMenu()" appTrackClick>Case Studies</a>
    <a [routerLink]="['/about']" routerLinkActive="active" (click)="closeMenu()" appTrackClick>About</a>
    <a [routerLink]="['/contact']" class="contact-btn" (click)="closeMenu()" appTrackClick>
      Contact Us
    </a>
  </nav>
</header>
