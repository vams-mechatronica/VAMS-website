<header class="header">
  <div class="container header-content">

    <a class="logo-box" [routerLink]="['/']" (click)="closeMenu()">
      <img src="assets/logos/VAMS_new_logo.png" loading="lazy" alt="VAMS Mechatronica" />
    </a>

    <!-- Desktop Navigation -->
    <nav class="nav">
      <a [routerLink]="['/']" fragment="services">Solutions</a>
      <a [routerLink]="['/industries']" routerLinkActive="active">Industries</a>
      <a [routerLink]="['/case-studies']" routerLinkActive="active">Case Studies</a>
      <a [routerLink]="['/about']" routerLinkActive="active">About</a>
      <a [routerLink]="['/contact']" class="contact-btn">Contact Us</a>
    </nav>

    <!-- Mobile Toggle -->
    <button
      class="mobile-toggle"
      [class.is-open]="isMenuOpen"
      aria-label="Toggle menu"
      [attr.aria-expanded]="isMenuOpen"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Navigation -->
  <div
    class="mobile-nav-backdrop"
    *ngIf="isMenuOpen"
    role="button"
    tabindex="0"
    aria-label="Close menu"
    (click)="closeMenu()"
    (keydown.enter)="closeMenu()"
    (keydown.space)="closeMenu()"
  ></div>
  <nav class="mobile-nav" [class.open]="isMenuOpen">
    <a [routerLink]="['/']" fragment="services" (click)="closeMenu()">Solutions</a>
    <a [routerLink]="['/industries']" routerLinkActive="active" (click)="closeMenu()">Industries</a>
    <a [routerLink]="['/case-studies']" routerLinkActive="active" (click)="closeMenu()">Case Studies</a>
    <a [routerLink]="['/about']" routerLinkActive="active" (click)="closeMenu()">About</a>
    <a [routerLink]="['/contact']" class="contact-btn" (click)="closeMenu()">
      Contact Us
    </a>
  </nav>
</header>
